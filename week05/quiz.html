<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Webpage</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML and CSS Quiz</h1>
    <form>
        <div class="form-item column2">
            <label for="q1">What does acronym CSS stand for?</label>
            <input type="text" id="q1" name="q1" required>
        </div>
        <div>
            <label for="q2">How are id and class attributes selected in CSS?</label>
            <textarea id="q2" name="q2" rows="4" required></textarea>
        </div>
        <div class="form-item column1">
            <label for="q3">Which CSS property is used to change the text color?</label>
            <select name="q3" id="q3" required>
                <option value="" selected disabled>Choose One ...</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="font-style">font-style</option>
            </select>
        </div>
        <div class="form-item column1">
            <label for="q4">How many heading levels exist in HTML?</label>
            <input type="number" name="q4" id="q4" required>
        </div>
        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
